<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Mami! ✨</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Quicksand:wght@400;600&display=swap');

        :root {
            --bg-gradient: linear-gradient(135deg, #fbc2eb 0%, #a6c1ee 100%);
            --glass-white: rgba(255, 255, 255, 0.8);
            --heart-pink: #ff758f;
            --deep-purple: #5e548e;
        }

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--bg-gradient);
            font-family: 'Quicksand', sans-serif;
            overflow: hidden;
        }

        /* Floating background items */
        .floating-bg {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* The Main Card */
        .card {
            background: var(--glass-white);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 40px 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            text-align: center;
            width: 85%;
            max-width: 350px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            position: relative;
            z-index: 10;
            animation: fadeIn 1.5s ease-out;
        }

        h1 {
            font-family: 'Dancing Script', cursive;
            font-size: 3rem;
            color: var(--heart-pink);
            margin: 0;
        }

        .age {
            font-size: 1.2rem;
            color: var(--deep-purple);
            font-weight: 600;
            letter-spacing: 2px;
            margin-bottom: 20px;
        }

        .message {
            color: #444;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        /* Interactive Button */
        .btn {
            background: var(--heart-pink);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 5px 15px rgba(255, 117, 143, 0.4);
        }

        .btn:hover {
            transform: scale(1.1);
        }

        /* Hidden Surprise Message */
        #surprise {
            display: none;
            margin-top: 20px;
            font-weight: 600;
            color: #ff4d6d;
            animation: popIn 0.5s ease-out;
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes popIn {
            0% { transform: scale(0); }
            100% { transform: scale(1); }
        }

        .floating-emoji {
            position: absolute;
            font-size: 24px;
            animation: floatUp var(--duration) linear infinite;
            opacity: 0;
        }

        @keyframes floatUp {
            0% { transform: translateY(110vh) translateX(0); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-10vh) translateX(var(--drift)); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="floating-bg" id="bg"></div>

    <div class="card">
        <div style="font-size: 50px;">✨🌸</div>
        <h1>Happy 34th!</h1>
        <div class="age">DEAREST MAMI</div>
        <p class="message">
            Wishing you a day as wonderful and beautiful as you are! 
            May this year be your best one yet.
        </p>
        
        <button class="btn" onclick="showSurprise()">Click for a Surprise! 🎁</button>
        
        <div id="surprise">
            You're the coolest Mami ever! <br> Enjoy your special day! 💖
        </div>
    </div>

    <script>
        // Function to create floating background emojis
        function createFloatingEmoji() {
            const emojis = ['💖', '✨', '🌸', '🎂', '🍭', '🎈'];
            const emoji = document.createElement('div');
            emoji.classList.add('floating-emoji');
            emoji.innerText = emojis[Math.floor(Math.random() * emojis.length)];
            
            const leftPos = Math.random() * 100;
            const duration = Math.random() * 3 + 5; // 5-8 seconds
            const drift = (Math.random() * 100) - 50; // Random horizontal drift
            
            emoji.style.left = leftPos + 'vw';
            emoji.style.setProperty('--duration', duration + 's');
            emoji.style.setProperty('--drift', drift + 'px');
            
            document.getElementById('bg').appendChild(emoji);
            
            setTimeout(() => {
                emoji.remove();
            }, duration * 1000);
        }

        // Create initial emojis and start interval
        for(let i=0; i<15; i++) {
            setTimeout(createFloatingEmoji, Math.random() * 5000);
        }
        setInterval(createFloatingEmoji, 800);

        function showSurprise() {
            const s = document.getElementById('surprise');
            s.style.display = 'block';
            // Simple confetti effect
            for(let i=0; i<20; i++) {
                setTimeout(createFloatingEmoji, i * 100);
            }
        }
    </script>
</body>
</html>
